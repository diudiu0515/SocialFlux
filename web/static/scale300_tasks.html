<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SocialFlux · T1–T4 LLM 答案核验</title>
<style>
:root{color-scheme:dark;background:#101419;color:#e7edf3;font-family:Inter,"Noto Sans SC",sans-serif}*{box-sizing:border-box}body{margin:0}a{color:#72b7ff}.top{position:sticky;top:0;z-index:3;background:#151b22;border-bottom:1px solid #2c3743;padding:13px 18px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}.top h1{font-size:18px;margin:0}.top select,.top input,.top button,textarea{background:#0f141a;color:#e7edf3;border:1px solid #3a4654;border-radius:6px;padding:8px}.top select{min-width:500px;max-width:65vw}.summary{padding:12px 18px;background:#19212a;border-bottom:1px solid #2c3743}.layout{max-width:1600px;margin:auto;padding:16px;display:grid;grid-template-columns:minmax(0,1fr) 370px;gap:16px}.panel{background:#171e26;border:1px solid #2c3743;border-radius:9px;padding:14px;margin-bottom:12px}pre{white-space:pre-wrap;word-break:break-word;background:#0d1217;padding:11px;border-radius:6px;max-height:650px;overflow:auto}details{margin:10px 0}.task{border-left:4px solid #537ca5}.notice{color:#f4c56b}.good{color:#72d69c}.bad{color:#ff8f8f}.muted{color:#91a0af}aside{position:sticky;top:82px;height:fit-content}textarea{width:100%;min-height:140px}label{display:block;margin:10px 0}.checks label{display:flex;gap:7px}button{cursor:pointer}@media(max-width:900px){.layout{grid-template-columns:1fr}.top select{min-width:260px;max-width:95vw}aside{position:static}}
.question-box,.answer-box{margin-top:10px;padding:13px;border-radius:9px;background:#10171e}.question-box{border:1px solid #304456}.answer-box{border:1px solid #385c4c;background:#111d19}.history-turn{display:grid;grid-template-columns:56px 1fr;gap:8px;padding:9px 0;border-bottom:1px solid #29323c}.history-turn b{color:#72b7ff}.history-turn p{margin:0 0 5px;line-height:1.55}.prediction-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:8px}.prediction{padding:10px;border:1px solid #30404e;border-radius:8px;background:#141b22}.prediction b{display:block;margin-bottom:6px}.prediction span,.prediction small{display:block;color:#b8c5d1;margin-top:3px}.actions{margin:8px 0;padding-left:22px}.actions li{margin:8px 0;line-height:1.55}.judgement{padding:12px 0;border-bottom:1px solid #303944}.judgement select{width:100%;margin-top:6px;background:#0f141a;color:#e7edf3;border:1px solid #3a4654;border-radius:6px;padding:8px}.judgement textarea{min-height:72px}.task-missing{border-left-color:#7c5a3c}.answer-label{color:#72d69c;font-weight:700}.human-note{padding:10px;border-radius:8px;background:#1b2116;color:#cfe3ae}
</style></head><body>
<div class="top"><a href="/">← Rollout 工作台</a><h1>T1–T4 · LLM 答案核验</h1><label>标注员 <input id="reviewer"></label><button id="prev">←</button><select id="picker"></select><button id="next">→</button><button id="refresh">刷新</button><button id="export">导出判断结果</button><button id="importBtn">导入</button><input id="importFile" type="file" accept="application/json,.json" hidden></div>
<div id="summary" class="summary">加载中…</div><div class="layout"><main id="content"></main><aside id="review" class="panel"></aside></div>
<script>
(function(){"use strict";
var KEY="socialflux.scale300.task.reviews.v1",data=null,index=0,pkg=null;
function esc(v){return String(v==null?"":v).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
function store(){try{return JSON.parse(localStorage.getItem(KEY)||'{"reviewer":"","records":{}}');}catch(e){return {reviewer:"",records:{}};}}
function save(x){localStorage.setItem(KEY,JSON.stringify(x));}async function get(url){var r=await fetch(url);if(!r.ok)throw new Error(await r.text());return r.json();}function current(){return data.candidates[index];}
function picker(){document.getElementById("picker").innerHTML=data.candidates.map(function(c,i){var s=(c.task_construction||{}).status||"pending";return '<option value="'+i+'" '+(i===index?'selected':'')+'>'+String(i+1).padStart(3,'0')+'/'+data.candidates.length+' · '+esc(c.scenario_id)+' · '+esc(c.turn_count||0)+'轮 · '+esc(s)+' · '+esc(c.title)+'</option>';}).join("");}
function summary(){var small=data.summary||{},tasks=small.answer_counts||small.task_counts||{},records=Object.values(store().records||{}),reviewed=records.filter(function(r){return r.task_judgements&&Object.values(r.task_judgements).some(function(j){return j.verdict&&j.verdict!=="pending";});}).length;document.getElementById("summary").innerHTML='<b>'+esc(data.total_scenarios||0)+' 个场景</b> · 已生成答案：T1 '+esc(tasks.T1||0)+' / T2 '+esc(tasks.T2||0)+' / T3 '+esc(tasks.T3||0)+' / T4 '+esc(tasks.T4||0)+' · 已人工判断 '+esc(reviewed)+'<br><span class="muted">人工只核验 LLM 答案是否正确；所有机器答案在人工确认前都不是 GT，也不进入正式池。</span>';}
var TASK_TITLES={T1:"T1 · 当前状态判断",T2:"T2 · 两段历史比较",T3:"T3 · 候选行动影响",T4:"T4 · 整段互动评价"},STATE_LABELS={"emotion.anger":"愤怒","emotion.anxiety":"焦虑","emotion.hope":"希望","relationship.trust":"信任","relationship.hostility":"敌意","behavioral_disposition.resolve":"坚持程度","behavioral_disposition.repair_intent":"修复意愿"};
function topChoice(o){var best=["无法判断",0];Object.keys(o||{}).forEach(function(k){if(Number(o[k])>best[1])best=[k,Number(o[k])];});return best;}
function label(k){var m={absent:"无",mild:"轻度",moderate:"中等",strong:"强",very_strong:"很强",cannot_determine:"无法判断",increase:"上升",similar:"基本不变",decrease:"下降",higher_in_a:"历史 A 更高",higher_in_b:"历史 B 更高"};return m[k]||STATE_LABELS[k]||k;}
function percent(v){return Math.round(Number(v||0)*100)+"%";}
function turnHistory(arr,title){arr=Array.isArray(arr)?arr:[];if(!arr.length)return'<p class="muted">'+esc(title)+'：没有额外历史。</p>';return'<details open><summary>'+esc(title)+'（'+arr.length+'轮）</summary>'+arr.map(function(x,i){var a=x.policy_action&&x.policy_action.text||x.evaluated_action&&x.evaluated_action.text||x.evaluated_agent||"",e=x.environment_response||x.environment_character||"";return'<div class="history-turn"><b>'+esc(x.turn_id||('第 '+(i+1)+' 轮'))+'</b><div><p>'+esc(a)+'</p><p class="muted">'+esc(e)+'</p></div></div>';}).join("")+'</details>';}
function taskQuestion(name,value){var instance=value.instance||{},input=instance.input||{},target=instance.target_spec||{},states=(target.target_state_ids||target.candidate_state_ids||[]).map(label).join("、");if(name==="T1")return'<div class="question-box"><b>问题</b><p>根据截至当前 checkpoint 的公开对话，判断目标人物的状态强度以及相对变化。</p><p class="muted">目标状态：'+esc(states)+'</p>'+turnHistory(input.history,"可观察对话历史")+'</div>';if(name==="T2")return'<div class="question-box"><b>问题</b><p>在共享前史和相同 ending 条件下，比较 History A 与 History B 中目标人物的状态差异。</p><p class="notice">当前为旧配对诊断题，不代表正式新策略 T2 已完成。</p><p class="muted">候选状态：'+esc(states)+'</p><div>'+turnHistory(input.history_a,"History A")+turnHistory(input.history_b,"History B")+'</div></div>';if(name==="T4")return'<div class="question-box"><b>问题</b><p>根据整段可观察互动，从目标达成、状态适应、风险管理、恢复和关系结果五方面评分。</p>'+turnHistory(instance.observable_trajectory,"完整可观察互动")+'</div>';var actions=input.candidate_actions||[];return'<div class="question-box"><b>问题</b><p>比较下列候选行动对目标人物状态的即时与延迟影响。</p><p class="notice">延迟影响仍待共享反事实分支模拟；当前答案只作为机器候选。</p><p class="muted">目标状态：'+esc(states)+'</p>'+turnHistory(input.history,"Checkpoint 前历史")+'<ol class="actions">'+actions.map(function(a){return'<li>'+esc(a.text||a)+'</li>';}).join("")+'</ol></div>';}
function citations(rows){return(rows||[]).map(function(x){return esc(x.turn_id)+'「'+esc(x.target_quote)+'」';}).join("；")||"未给出";}
function answerHtml(name,value){var a=value.llm_answer||{},instance=value.instance||{},input=instance.input||{};if(name==="T1")return'<div class="answer-box"><div class="answer-label">LLM 已生成答案</div><div class="prediction-grid">'+(a.predictions||[]).map(function(p){var intensity=topChoice(p.intensity_probabilities),change=topChoice(p.change_probabilities);return'<div class="prediction"><b>'+esc(label(p.state_id))+'</b><span>强度：'+esc(label(intensity[0]))+'（'+percent(intensity[1])+'）</span><span>变化：'+esc(label(change[0]))+'（'+percent(change[1])+'）</span><small>证据轮次：'+esc((p.evidence_turn_ids||[]).join("、")||"未给出")+'</small></div>';}).join("")+'</div></div>';if(name==="T2")return'<div class="answer-box"><div class="answer-label">LLM 已生成答案</div><div class="prediction-grid">'+(a.predictions||[]).map(function(p){var direction=topChoice(p.direction_probabilities);return'<div class="prediction"><b>'+esc(label(p.state_id))+'</b><span>'+esc(label(direction[0]))+'（'+percent(direction[1])+'）</span><small>A 证据：'+citations(p.evidence_a)+'</small><small>B 证据：'+citations(p.evidence_b)+'</small><small>'+esc(p.rationale||"")+'</small></div>';}).join("")+'</div></div>';if(name==="T4")return'<div class="answer-box"><div class="answer-label">LLM 已生成答案</div><div class="prediction-grid">'+Object.keys(a.dimensions||{}).map(function(k){var p=a.dimensions[k]||{};return'<div class="prediction"><b>'+esc(label(k))+'</b><span>评分：'+esc(p.score==null?"证据不足":p.score+" / 10")+'</span><small>证据轮次：'+esc((p.evidence_turn_ids||[]).join("、")||"未给出")+'</small><small>'+esc(p.rationale||"")+'</small></div>';}).join("")+'</div><p class="muted">总体不确定性：'+esc(a.overall_uncertainty||"")+'</p></div>';var actions=input.candidate_actions||[];return'<div class="answer-box"><div class="answer-label">LLM 已生成答案</div>'+(a.options||[]).map(function(o){return'<h3>行动 '+(Number(o.action_index)+1)+'：'+esc((actions[o.action_index]||{}).text||"")+'</h3><div class="prediction-grid">'+(o.state_predictions||[]).map(function(p){var immediate=topChoice(p.immediate),delayed=topChoice(p.delayed);return'<div class="prediction"><b>'+esc(label(p.state_id))+'</b><span>即时：'+esc(label(immediate[0]))+'（'+percent(immediate[1])+'）</span><span>延迟：'+esc(label(delayed[0]))+'（'+percent(delayed[1])+'）</span><small>证据轮次：'+esc((p.evidence_turn_ids||[]).join("、")||"未给出")+'</small></div>';}).join("")+'</div>';}).join("")+'</div>';}
function taskPanel(name,value){if(!value)return'<section class="panel task task-missing"><h2>'+TASK_TITLES[name]+'</h2><p class="notice">该场景尚未构造这个任务，不要求人工补写答案。</p></section>';return'<section class="panel task"><h2>'+TASK_TITLES[name]+'</h2>'+taskQuestion(name,value)+(value.llm_answer?answerHtml(name,value):'<p class="notice">该任务缺少 LLM 答案，不要求人工填写答案。</p>')+'</section>';}
function render(){var c=current(),status=(pkg||{}).status||"pending",tasks=pkg&&pkg.tasks||{},quality=(pkg&&pkg.source_quality)||{},critical=quality.critical_precheck_failures||[];document.getElementById("content").innerHTML='<section class="panel"><h2>'+esc(c.scenario_id)+' · '+esc(c.title)+'</h2><p>来源 rollout：'+esc(c.turn_count||0)+'轮 · '+esc(c.generation_status)+' · v3 状态 '+esc(status)+'</p>'+(critical.length?'<p class="bad">源轨迹明确阻断：'+esc(critical.join("、"))+'；本页答案只用于诊断。</p>':'')+'<p class="human-note">页面只展示公开对话、任务问题和 LLM 候选答案。人工只判断答案是否正确，不需要重写答案。</p><p><a href="/">返回阅读完整对话</a></p></section>'+["T1","T2","T3","T4"].map(function(k){return taskPanel(k,tasks[k]);}).join("");review();}
function verdictOptions(){return'<option value="pending">尚未判断</option><option value="correct">正确</option><option value="partially_correct">部分正确</option><option value="incorrect">错误</option><option value="cannot_judge">现有信息无法判断</option>';}
function review(){var c=current(),all=store(),r=all.records[c.scenario_id]||{},judgements=r.task_judgements||{},tasks=pkg&&pkg.tasks||{},available=["T1","T2","T3","T4"].filter(function(k){return tasks[k]&&tasks[k].llm_answer;});document.getElementById("review").innerHTML='<h2>人工只判断答案</h2><p>逐项判断 LLM 答案。无需填写标准答案。</p>'+["T1","T2","T3","T4"].map(function(k){if(available.indexOf(k)<0)return'<div class="judgement"><b>'+TASK_TITLES[k]+'</b><p class="muted">无可核验的 LLM 答案</p></div>';var j=judgements[k]||{};return'<div class="judgement"><b>'+TASK_TITLES[k]+'</b><select data-verdict="'+k+'">'+verdictOptions()+'</select><label>可选：指出错误位置，不需要写正确答案<textarea data-task-note="'+k+'" placeholder="例如：证据轮次不支持“信任上升”">'+esc(j.notes||"")+'</textarea></label></div>';}).join("")+'<button id="save">保存四项判断</button><p class="muted">判断保存在当前浏览器 localStorage；关闭 VSCode 页面后仍在，同一浏览器可继续。建议定期导出备份。</p>';available.forEach(function(k){document.querySelector('[data-verdict="'+k+'"]').value=(judgements[k]||{}).verdict||"pending";});document.getElementById("save").onclick=function(){var x=store(),taskJudgements={};document.querySelectorAll("[data-verdict]").forEach(function(n){var k=n.dataset.verdict,note=document.querySelector('[data-task-note="'+k+'"]');taskJudgements[k]={verdict:n.value,notes:note?note.value:""};});var vals=Object.keys(taskJudgements).map(function(k){return taskJudgements[k].verdict;}),status=vals.length&&vals.every(function(v){return v==="correct";})?"approved":vals.indexOf("incorrect")>=0?"rejected":vals.indexOf("partially_correct")>=0?"needs_revision":vals.indexOf("cannot_judge")>=0?"blocked":"pending";x.reviewer=document.getElementById("reviewer").value.trim();x.records[c.scenario_id]=Object.assign({},r,{record_type:"scale300_t1_t4_answer_verification",record_id:c.scenario_id,scenario_id:c.scenario_id,source_trajectory_id:pkg&&pkg.source_trajectory_id,status:status,task_judgements:taskJudgements,human_supplied_answer:false,updated_at_utc:new Date().toISOString()});save(x);alert("T1–T4 判断已保存在当前浏览器");};}
async function loadOne(){picker();pkg=await get('/api/scale300-task/'+encodeURIComponent(current().scenario_id));render();}async function refresh(){data=await get('/api/scale300-tasks');if(index>=data.candidates.length)index=0;summary();if(data.candidates.length){await loadOne();return;}picker();pkg=null;document.getElementById('content').innerHTML='<section class="panel notice">旧任务数据已归档。新批次完成 Gate 3 和任务构建后会在此出现。</section>';document.getElementById('review').innerHTML='<h2>无活跃任务</h2><p class="muted">任务审核框架与浏览器草稿功能仍保留。</p>';}
document.getElementById("picker").onchange=function(){index=Number(this.value);loadOne().catch(function(e){alert(e.message);});};document.getElementById("prev").onclick=function(){if(index>0){index--;loadOne();}};document.getElementById("next").onclick=function(){if(index+1<data.candidates.length){index++;loadOne();}};document.getElementById("refresh").onclick=function(){refresh().catch(function(e){alert(e.message);});};document.getElementById("reviewer").value=store().reviewer||"";document.getElementById("reviewer").oninput=function(){var x=store();x.reviewer=this.value.trim();save(x);};document.getElementById("export").onclick=function(){var x=store(),p={format:"socialflux_scale300_task_human_review_export_v1",exported_at_utc:new Date().toISOString(),reviewer:x.reviewer,records:Object.values(x.records)};var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(p,null,2)],{type:'application/json'}));a.download='socialflux-scale300-task-reviews.json';a.click();URL.revokeObjectURL(a.href);};document.getElementById("importBtn").onclick=function(){document.getElementById("importFile").click();};document.getElementById("importFile").onchange=async function(){try{var p=JSON.parse(await this.files[0].text()),x=store();(p.records||[]).forEach(function(r){if(r.scenario_id)x.records[r.scenario_id]=r;});if(p.reviewer)x.reviewer=p.reviewer;save(x);document.getElementById("reviewer").value=x.reviewer;review();alert('导入完成');}catch(e){alert('导入失败：'+e.message);}finally{this.value='';}};refresh().catch(function(e){document.getElementById("content").innerHTML='<section class="panel bad">无法加载：'+esc(e.message)+'</section>';});setInterval(function(){get('/api/scale300-tasks').then(function(x){data=x;summary();picker();});},30000);
})();
</script></body></html>
