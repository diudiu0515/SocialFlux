<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>SocialFlux · T2 历史差异复核</title>
  <style>body{margin:0;background:#0a0f16;color:#e8eef5;font:15px/1.65 Inter,"Noto Sans SC",system-ui}.wrap{max-width:1480px;margin:auto;padding:24px}.hero,.card,.panel{background:#111a25;border:1px solid #29394a;border-radius:14px}.hero{padding:22px;margin-bottom:18px}.hero h1{margin:0 0 8px}.toolbar,.meta{display:flex;gap:9px;flex-wrap:wrap;align-items:center}.button,.pill{border:1px solid #3a5269;border-radius:999px;padding:7px 11px;background:#182635;color:#dceaf5;text-decoration:none}.button{cursor:pointer}.muted{color:#9aabba}.summary{margin:16px 0}.grid{display:grid;gap:18px}.card{padding:20px}.histories{display:grid;grid-template-columns:1fr 1fr;gap:14px}.panel{padding:14px;margin:10px 0}.turn{margin:9px 0;padding:11px;border-left:3px solid #547b9a;background:#0d151e}.target{color:#9bd6ff}.agent{color:#c8b4f4}.ending{border-color:#68a989}.answer{border-color:#8d75c0}.quote{margin:7px 0;padding:8px;background:#101e2b;border-radius:8px}.good{color:#91dfb7}.warn{color:#f0ca82}.bad{color:#f09595}textarea{width:100%;min-height:78px;box-sizing:border-box;background:#091019;color:#eef;border:1px solid #38516a;border-radius:8px;padding:9px}details summary{cursor:pointer;color:#a9d2ef}table{width:100%;border-collapse:collapse}th,td{text-align:left;vertical-align:top;border-bottom:1px solid #29394a;padding:8px}@media(max-width:900px){.histories{grid-template-columns:1fr}.wrap{padding:11px}}</style>
</head>
<body>
<main class="wrap">
  <header class="hero">
    <h1>T2 · 相同 ending，不同历史</h1>
    <p class="muted">只显示人需要判断的 A/B 对话、相同结尾、LLM 答案与证据。Structured Appraisal、原始 ledger 和逐轮内部日志不在本页展示。</p>
    <div class="toolbar">
      <a class="button" href="/">返回总工作台</a>
      <button class="button" id="export">导出本地审核</button>
      <button class="button" id="clear">清空本页审核</button>
    </div>
  </header>
  <section id="summary" class="summary panel">正在加载…</section>
  <section id="pairs" class="grid"></section>
</main>
<script>
const key='socialflux.t2ExpressionReview.v1';let packet=null,draft=JSON.parse(localStorage.getItem(key)||'{}');
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const top=o=>Object.entries(o||{}).sort((a,b)=>b[1]-a[1])[0]||['—',0];
const direction=o=>{const t=top(o);return `${esc(t[0])} · ${Math.round(t[1]*100)}%`};
const evidence=rows=>(rows||[]).map(e=>typeof e==='string'?`<div class="quote bad"><b>${esc(e)}</b> 旧版仅有轮次、没有目标人物引文；本轮答案生成失败，不可用。</div>`:`<div class="quote"><b>${esc(e.turn_id)}</b> “${esc(e.target_quote)}”<br><span class="muted">${esc(e.interpretation)}</span></div>`).join('');
const turn=t=>`<div class="turn"><div class="agent"><b>被测 Agent：</b>${esc(t.evaluated_agent)}</div><div class="target"><b>目标人物：</b>${esc(t.environment_character)}</div>${t.observable_expression?`<small class="muted">可观察表达：${esc(Object.values(t.observable_expression).flat().join('；'))}</small>`:''}</div>`;
const history=(title,rows)=>`<div><h3>${title}</h3>${(rows||[]).map(turn).join('')}</div>`;
const answer=p=>`<div class="panel answer"><h3>LLM 候选答案（等待人判断）</h3>${(p.llm_answer?.predictions||[]).map(x=>`<h4>${esc(x.state_id)}：${direction(x.direction_probabilities)}</h4><div class="histories"><div><b>A 侧目标人物证据</b>${evidence(x.evidence_a)}</div><div><b>B 侧目标人物证据</b>${evidence(x.evidence_b)}</div></div><p>${esc(x.rationale)}</p>`).join('')}<details><summary>相同表达为何可能对应不同状态</summary><p><b>A：</b>${esc(p.llm_answer?.shared_expression_explanation?.history_a)}</p><p><b>B：</b>${esc(p.llm_answer?.shared_expression_explanation?.history_b)}</p><p class="muted">证据边界：${esc(p.llm_answer?.shared_expression_explanation?.uncertainty)}</p></details></div>`;
const audit=p=>{const c=p.codex_semantic_review||{};return `<div class="panel"><h3>复核状态</h3><p>程序检查：${Object.values(p.program_checks||{}).every(Boolean)?'<span class="good">通过</span>':'<span class="warn">有缺口</span>'}　独立模型复核：<b>${esc(p.model_semantic_review?.decision||'pending')}</b>　完整阅读复核：<b class="${c.decision==='pass'?'good':c.decision==='reject'?'bad':'warn'}">${esc(c.decision||'pending')}</b></p>${c.summary?`<p>${esc(c.summary)}</p>`:''}<details><summary>研究核验：后台状态与表达解释（不属于模型输入）</summary><table><tr><th>变量</th><th>A</th><th>B</th></tr>${Object.keys(p.backend?.internal_directions_not_ground_truth||{}).map(s=>`<tr><td>${esc(s)}</td><td>${esc(p.backend.state_a[s])}</td><td>${esc(p.backend.state_b[s])}</td></tr>`).join('')}</table><p><b>A 表达意图：</b>${esc(p.backend?.expression_intent_a)}</p><p><b>B 表达意图：</b>${esc(p.backend?.expression_intent_b)}</p></details></div>`};
const review=p=>{const d=draft[p.scenario_id]||{};return `<div class="panel"><h3>人工判断</h3><label><input type="radio" name="r-${p.scenario_id}" value="approve" ${d.decision==='approve'?'checked':''}>答案正确</label>　<label><input type="radio" name="r-${p.scenario_id}" value="revise" ${d.decision==='revise'?'checked':''}>需修订</label>　<label><input type="radio" name="r-${p.scenario_id}" value="reject" ${d.decision==='reject'?'checked':''}>配对无效</label><textarea data-note="${p.scenario_id}" placeholder="指出变量、方向、证据轮次或对话问题">${esc(d.notes||'')}</textarea><small class="good">自动保存在当前浏览器；请导出 JSON 备份。</small></div>`};
const card=p=>`<article class="card"><h2>${esc(p.scenario_id)} · ${esc(p.scenario_title)}</h2><div class="meta"><span class="pill">${esc(p.relationship)}</span><span class="pill">目标人物：${esc(p.instance.input.target_character.name)}</span><span class="pill">媒体：${esc(p.media.status)}</span><span class="pill">实际请求：${esc(p.codex_semantic_review?.actual_total_requests||p.request_counts.total)}</span></div><p>${esc(p.instance.input.shared_background)}</p><div class="histories">${history('History A',p.instance.input.history_a)}${history('History B',p.instance.input.history_b)}</div><div class="turn ending"><div class="agent"><b>共同 t6 Agent：</b>${esc(p.instance.input.shared_current_action.text)}</div><div class="target"><b>字节一致的共同 ending：</b>${esc(p.instance.input.shared_current_observation.current_response)}</div><small class="muted">${esc(Object.values(p.instance.input.shared_current_observation.observable_expression||{}).flat().join('；'))}</small></div>${answer(p)}${audit(p)}${review(p)}</article>`;
function render(){document.querySelector('#summary').innerHTML=`<b>${packet.pairs.length} 组开发配对</b> · 媒体 ${packet.media_status} · 人工验收 ${packet.human_review} · LLM 答案不是 GT`;document.querySelector('#pairs').innerHTML=packet.pairs.map(card).join('');document.querySelectorAll('input,textarea').forEach(x=>x.onchange=save)}
function save(e){const id=(e.target.name||e.target.dataset.note||'').replace('r-','');const radio=document.querySelector(`input[name="r-${id}"]:checked`),note=document.querySelector(`[data-note="${id}"]`);draft[id]={decision:radio?.value||'',notes:note?.value||'',updated_at:new Date().toISOString()};localStorage.setItem(key,JSON.stringify(draft))}
document.querySelector('#export').onclick=()=>{const b=new Blob([JSON.stringify({format:'socialflux_t2_expression_human_review_v1',exported_at:new Date().toISOString(),records:draft},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='socialflux-t2-review.json';a.click();URL.revokeObjectURL(a.href)};
document.querySelector('#clear').onclick=()=>{if(confirm('确认清空本页浏览器审核草稿？')){draft={};localStorage.removeItem(key);render()}};
fetch('/api/t2-expression-dev').then(r=>{if(!r.ok)throw Error(r.status);return r.json()}).then(x=>{packet=x;render()}).catch(e=>document.querySelector('#summary').textContent='加载失败：'+e);
</script>
</body>
</html>
