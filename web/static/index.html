<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>SocialFlux · Annotation Studio</title>
  <link rel="stylesheet" href="/styles.css?v=talking-head-audio-v4">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand">
        <span class="brand-mark">SF</span>
        <div><strong>SocialFlux</strong><small>Annotation Studio</small></div>
      </div>
      <div class="local-notice">草稿仅保存在当前浏览器，不会写入正式 GT。</div>
      <label class="search-box"><span>⌕</span><input id="scenarioSearch" type="search" placeholder="搜索情节或 ID"></label>
      <div class="side-label">SCENARIO QUEUE <span id="scenarioCount">—</span></div>
      <div id="scenarioList" class="scenario-list"></div>
      <div class="sidebar-actions">
        <button id="exportButton" class="button primary">导出标注草稿 JSON</button>
        <button id="importButton" class="button">导入标注草稿 JSON</button>
        <input id="importFile" type="file" accept="application/json,.json" hidden>
        <div id="localProgress" class="local-progress">0 条已处理</div>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div>
          <div class="eyebrow">SCENARIO · ROLLOUT · TASK REVIEW</div>
          <h1>人工标注工作台</h1>
        </div>
        <div class="top-actions">
          <label class="reviewer-field">标注员 <input id="reviewerId" placeholder="请输入姓名或 ID"></label>
          <div id="gateBadge" class="gate-badge">loading</div>
        </div>
      </header>

      <section id="overview" class="overview-grid"></section>
      <section id="scenarioHeader" class="scenario-header panel loading">正在加载 scenario…</section>

      <nav class="view-tabs" aria-label="标注类型">
        <button class="view-tab active" data-view="scenario"><span>01</span>Scenario 情节</button>
        <button class="view-tab" data-view="rollout"><span>02</span>Rollout 轨迹</button>
        <button class="view-tab" data-view="task"><span>03</span>Task 标注</button>
        <button class="view-tab" data-view="manual"><span>04</span>人工总清单</button>
        <button class="view-tab" data-view="materials"><span>05</span>原始材料</button>
        <button class="view-tab" data-view="scale20"><span>06</span>Scale20 人审</button>
        <a class="view-tab" href="/scale150.html"><span>07</span>Scale300 · 四 Gate 人审</a>
        <a class="view-tab" href="/task_examples.html"><span>08</span>T1–T3 示例与视频</a>
        <a class="view-tab" href="/scale300_tasks.html"><span>09</span>Scale300 · T1–T4</a>
        <a class="view-tab" href="/t2_dev_review.html"><span>10</span>T2 · 历史差异复核</a>
        <button class="view-tab" data-r3-review><span>11</span>R3 旧诊断</button>
      </nav>
      <section id="viewToolbar" class="view-toolbar"></section>
      <div class="workspace-grid">
        <section id="viewContent" class="view-content"></section>
        <aside id="annotationPanel" class="annotation-panel panel"></aside>
      </div>
    </main>
  </div>
  <div id="toast" class="toast" role="status"></div>
  <script src="/app.js?v=scale200-review-link"></script>
</body>
</html>
