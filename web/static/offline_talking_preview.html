<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>SocialFlux · 台词视频预览</title>
  <link rel="stylesheet" href="/offline_review.css?v=2">
  <style>
    .preview-main{max-width:1100px;margin:auto;padding:24px}
    .scene-tabs{display:flex;flex-wrap:wrap;gap:8px;margin:20px 0}
    .scene-tabs button[aria-selected=true]{background:#164d3e;color:white}
    .preview-card{padding:24px;margin:20px 0;border:1px solid #d7e2da;border-radius:14px;background:white}
    .preview-card video{display:block;width:100%;max-width:800px;background:#15251e;border-radius:8px}
    .transcript{white-space:pre-wrap;font-size:17px;line-height:1.8}
    .pending-video{padding:32px;background:#eef3ef;border-radius:8px}
  </style>
</head>
<body>
  <header class="topbar"><div><a class="back" href="/offline-review">← 离线题库</a><h1>台词视频预览 <span id="sceneCount">小批样片</span></h1></div><button id="refresh" type="button">刷新进度</button></header>
  <main class="preview-main">
    <p>每个场景先看一条完整英文台词样片。对照英文对白，检查说话节奏、表情和口型是否自然；可展开中文源记录核对含义。</p>
    <p class="muted">本批为独立虚构人物样片，人物外观可能与旧版素材不同。</p>
    <p class="muted">自动转写可能有识别误差，请结合视频听看；标为待修正的片段尚未通过台词核验。</p>
    <p class="notice">本批选择 T2 共同回应作为样片，供两段历史共用；全部视频仍待人工审核。完整前史版本尚未完成。</p>
    <p id="progress" role="status" aria-live="polite">正在读取预览…</p>
    <p id="excluded" class="muted"></p>
    <nav id="scenes" class="scene-tabs" aria-label="选择场景"></nav>
    <section id="videos" aria-label="场景视频"></section>
  </main>
  <script src="/offline_talking_preview.js?v=4"></script>
</body>
</html>
