<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>SocialFlux · T1–T3 示例审核框架</title>
  <link rel="stylesheet" href="/styles.css?v=task-examples-v1">
  <style>
    body{margin:0;background:#090d13;color:#e8edf4;font-family:Inter,"Noto Sans SC",system-ui,sans-serif}.wrap{max-width:1280px;margin:auto;padding:26px}.hero,.card{background:#111822;border:1px solid #263443;border-radius:16px}.hero{padding:24px;margin-bottom:18px}.hero h1{margin:8px 0}.muted{color:#96a6b7}.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.button,.pill{border:1px solid #34475c;border-radius:999px;padding:8px 12px;color:#dbe8f5;background:#182330;text-decoration:none}.button{cursor:pointer}.task-grid{display:grid;gap:18px}.card{padding:22px}.card h2{margin:0 0 8px}.meta{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 18px}.pill.good{border-color:#34785d;color:#9ce3bf}.pill.warn{border-color:#765e32;color:#f0cc83}.split{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(300px,1fr);gap:18px}.panel{background:#0c121a;border:1px solid #253342;border-radius:12px;padding:14px;margin:12px 0}.history{display:grid;gap:10px}.turn{border-left:3px solid #365a77;background:#0e1620;padding:12px;border-radius:0 10px 10px 0}.speaker{color:#82b7df;font-size:12px;letter-spacing:.04em;margin-top:6px}.event{color:#e9bd73;border-left-color:#956d2c}.answer-table{width:100%;border-collapse:collapse;font-size:13px}.answer-table th,.answer-table td{border-bottom:1px solid #263443;text-align:left;padding:8px;vertical-align:top}.answer-table th{color:#91abc0}.video{width:100%;max-height:390px;background:#000;border-radius:12px}.warning{background:#2a2215;border:1px solid #6d5529;color:#efd096;padding:11px;border-radius:10px}.review textarea{box-sizing:border-box;width:100%;min-height:88px;background:#0a1017;color:#eef;border:1px solid #34475c;border-radius:8px;padding:10px}.review label{margin-right:14px}.saved{color:#7dd4a5;font-size:12px}.histories{display:grid;grid-template-columns:1fr 1fr;gap:12px}details{margin-top:12px}summary{cursor:pointer;color:#99c8ea}pre{white-space:pre-wrap;word-break:break-word;font-size:11px;max-height:460px;overflow:auto}.option{border-left:3px solid #8069b0;padding:9px 12px;margin:8px 0;background:#141326}.top-answer{font-weight:700;color:#a8d8fa}@media(max-width:900px){.split,.histories{grid-template-columns:1fr}.wrap{padding:12px}}
  </style>
</head>
<body>
  <main class="wrap">
    <section class="hero">
      <div class="toolbar"><a class="button" href="/">← 返回主工作台</a><span id="status" class="pill">加载中</span><button id="export" class="button">导出本页审核 JSON</button></div>
      <h1>T1–T3 示例与媒体审核框架</h1>
      <p class="muted">页面与审核合同保留；当前没有示例数据或视频。接入新批次后，这里展示公开证据、模型 proposal 与外部 API 媒体，ground_truth 仍保持 null。</p>
    </section>
    <section id="summary" class="panel"></section>
    <section id="tasks" class="task-grid"></section>
  </main>
<script>
const storeKey='socialflux.taskExamples.v1';
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const top=p=>Object.entries(p||{}).sort((a,b)=>b[1]-a[1])[0]||['—',0];
const loadDraft=()=>{try{return JSON.parse(localStorage.getItem(storeKey)||'{}')}catch{return {}}};
let packet=null,draft=loadDraft();
function turnHtml(t){const events=(t.public_events_after||[]).map(e=>`<div class="turn event"><div class="speaker">公开事件</div>${esc(e.text)}</div>`).join('');return `<div class="turn"><div class="speaker">${esc(t.turn_id)} · 被测 Agent</div>${esc(t.evaluated_agent||t.policy_action?.text)}<div class="speaker">Environment 人物</div>${esc(t.environment_character||t.environment_response)}</div>${events}`}
function historyHtml(rows){return `<div class="history">${(rows||[]).map(turnHtml).join('')}</div>`}
function answerHtml(ex){const a=ex.llm_answer||{};if(ex.task==='T1')return `<table class="answer-table"><tr><th>状态</th><th>强度</th><th>变化</th><th>证据</th></tr>${a.predictions.map(r=>`<tr><td>${esc(r.state_id)}</td><td class="top-answer">${esc(top(r.intensity_probabilities)[0])} ${(top(r.intensity_probabilities)[1]*100).toFixed(0)}%</td><td>${esc(top(r.change_probabilities)[0])} ${(top(r.change_probabilities)[1]*100).toFixed(0)}%</td><td>${esc(r.evidence_turn_ids.join(', '))}</td></tr>`).join('')}</table>`;if(ex.task==='T2')return `<table class="answer-table"><tr><th>状态</th><th>方向</th><th>置信度</th><th>可观察因果依据</th></tr>${a.predictions.map(r=>`<tr><td>${esc(r.state_id)}</td><td class="top-answer">${esc(top(r.direction_probabilities)[0])} ${(top(r.direction_probabilities)[1]*100).toFixed(0)}%</td><td>${Math.round((r.confidence||0)*100)}%</td><td>${esc((r.causal_relevance||[]).join('；'))}</td></tr>`).join('')}</table>`;return a.options.map(o=>`<div class="panel"><b>候选 ${o.action_index}</b><table class="answer-table"><tr><th>状态</th><th>即时</th><th>延迟</th></tr>${o.state_predictions.map(r=>`<tr><td>${esc(r.state_id)}</td><td>${esc(top(r.immediate)[0])} ${(top(r.immediate)[1]*100).toFixed(0)}%</td><td>${esc(top(r.delayed)[0])} ${(top(r.delayed)[1]*100).toFixed(0)}%</td></tr>`).join('')}</table></div>`).join('')}
function inputsHtml(ex){const i=ex.text_instance.input;if(ex.task==='T2')return `<div class="histories"><div><h3>History A</h3>${historyHtml(i.history_a)}</div><div><h3>History B</h3>${historyHtml(i.history_b)}</div></div><div class="panel"><b>字节一致的共同当前观察 O*</b><p>${esc(i.shared_current_observation.current_response)}</p></div>`;const options=(i.candidate_actions||[]).map((a,n)=>`<div class="option"><b>候选 ${n}</b> ${esc(a.text)}</div>`).join('');return `${historyHtml(i.history)}${options?`<h3>同一 checkpoint 的候选行动</h3>${options}`:''}`}
function reviewHtml(ex){const d=draft[ex.task]||{};return `<div class="panel review"><h3>人工核验</h3><p><label><input type="radio" name="r-${ex.task}" value="approve" ${d.decision==='approve'?'checked':''}>通过</label><label><input type="radio" name="r-${ex.task}" value="revise" ${d.decision==='revise'?'checked':''}>需修订</label><label><input type="radio" name="r-${ex.task}" value="reject" ${d.decision==='reject'?'checked':''}>拒绝</label></p><textarea data-notes="${ex.task}" placeholder="记录具体状态、证据或视频问题">${esc(d.notes||'')}</textarea><div class="saved">自动保存在当前浏览器；建议导出备份。</div></div>`}
function render(){document.querySelector('#status').textContent=packet.status;document.querySelector('#summary').innerHTML=`<b>${packet.examples.length} 个任务示例</b> · 选中答案请求 ${packet.actual_llm_request_count_selected_answers} · 开发对照请求 ${packet.development_llm_request_count} · 人工 GT ${packet.human_ground_truth_count}`;document.querySelector('#tasks').innerHTML=packet.examples.map(ex=>{const i=ex.text_instance;const m=ex.media||{};const caveats=(i.metadata?.limitations||i.metadata?.caveats||[]);return `<article class="card"><h2>${esc(ex.task)} · ${esc(ex.title)}</h2><div class="meta"><span class="pill">${esc(i.instance_id)}</span><span class="pill good">ground_truth = null</span><span class="pill">${esc(ex.answer_provenance.answer_type)}</span>${m.status?`<span class="pill ${m.status==='generated'?'good':'warn'}">video ${esc(m.status)}</span>`:''}</div>${caveats.length?`<div class="warning">${esc(caveats.join('；'))}</div>`:''}<div class="split"><div><h3>公开输入</h3>${inputsHtml(ex)}</div><div>${m.url&&m.shown_to_model!==false?`<h3>配对视频</h3><video class="video" controls preload="metadata" src="${esc(m.url)}"></video><p class="muted">台词：${esc(i.input.current_checkpoint?.current_response||i.input.shared_current_observation?.current_response)}</p>`:`<div class="warning">T3 输入不展示动作触发后的未来视频，防止答案泄漏。</div>`}<h3>LLM 答案</h3>${answerHtml(ex)}${reviewHtml(ex)}</div></div><details><summary>完整实例与 provenance JSON</summary><pre>${esc(JSON.stringify(ex,null,2))}</pre></details></article>`}).join('');bind()}
function bind(){document.querySelectorAll('input[type=radio]').forEach(el=>el.onchange=()=>save(el.name.slice(2)));document.querySelectorAll('textarea[data-notes]').forEach(el=>el.oninput=()=>save(el.dataset.notes))}
function save(task){const checked=document.querySelector(`input[name="r-${task}"]:checked`);const notes=document.querySelector(`textarea[data-notes="${task}"]`);draft[task]={decision:checked?.value||'',notes:notes?.value||'',updated_at:new Date().toISOString()};localStorage.setItem(storeKey,JSON.stringify(draft))}
document.querySelector('#export').onclick=()=>{const blob=new Blob([JSON.stringify({format:'socialflux_task_example_human_review_v1',exported_at:new Date().toISOString(),records:draft},null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='socialflux-task-example-review.json';a.click();URL.revokeObjectURL(a.href)};
fetch('/api/task-examples').then(r=>{if(!r.ok)throw Error(r.status);return r.json()}).then(x=>{packet=x;render()}).catch(e=>{document.querySelector('#status').textContent='加载失败 '+e});
</script>
</body>
</html>
