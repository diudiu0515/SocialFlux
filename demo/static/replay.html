<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Trajectory Replay · EmoTree Demo</title><link rel="stylesheet" href="styles.css"></head><body data-page="replay"><header><div class="nav"><div class="brand">Emo<span>Tree</span> Demo</div><nav id="nav"></nav></div></header><main class="wrap"><div class="eyebrow">Trajectory logging & replay</div><h1>逐轮回放，<br>也可以分叉。</h1><div class="panel"><div class="replay-controls"><select id="replaySession"><option value="">选择 trajectory</option></select><input id="step" type="range" min="0" value="0"><b id="stepLabel">Turn 0</b><button id="fork" class="secondary">从此轮 Fork</button></div></div><div class="debug-grid" style="margin-top:16px"><div class="panel state-card"><div class="eyebrow" style="color:var(--lime)">State at step</div><div id="replayState" class="state-name">—</div><div id="replayTransition" class="transition"></div></div><div class="panel"><h2>Trajectory Curve</h2><div id="replayChart"></div></div><div class="panel"><h2>Conversation until this turn</h2><div id="replayConversation" class="history"></div></div><div class="panel"><h2>Complete Turn Log</h2><pre id="replayLog" class="log"></pre></div></div></main><script src="app.js"></script></body></html>
