; Repository-owned lifecycle for the local annotation website.
; Create build/web-service before starting Supervisor with this config.
[unix_http_server]
file=%(here)s/../build/web-service/supervisor.sock
chmod=0600

[supervisord]
logfile=%(here)s/../build/web-service/supervisor.log
logfile_maxbytes=2MB
logfile_backups=2
pidfile=%(here)s/../build/web-service/supervisord.pid
childlogdir=%(here)s/../build/web-service
nodaemon=false

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix://%(here)s/../build/web-service/supervisor.sock

[program:socialflux-web]
command=python -u -m web.server --host 127.0.0.1 --port 8000
directory=%(here)s/..
autostart=true
autorestart=true
startsecs=3
startretries=5
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=%(here)s/../build/web-service/web.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=2
