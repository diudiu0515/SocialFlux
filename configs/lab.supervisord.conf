; GitHub-connected Lab, separate from the existing localhost:8000 workbench.
; Create build/lab-deployment and .secrets/lab-public-password (mode 600) first.
[unix_http_server]
file=%(here)s/../build/lab-deployment/supervisor.sock
chmod=0600

[supervisord]
logfile=%(here)s/../build/lab-deployment/supervisor.log
logfile_maxbytes=2MB
logfile_backups=2
pidfile=%(here)s/../build/lab-deployment/supervisord.pid
childlogdir=%(here)s/../build/lab-deployment
nodaemon=false

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix://%(here)s/../build/lab-deployment/supervisor.sock

[program:socialflux-lab-public]
command=python -u scripts/run_github_lab.py --remote git@github.com:diudiu0515/SocialFlux.git --branch lab-backend-deploy-20261022 --data-root . --state-dir build/lab-deployment --password-file .secrets/lab-public-password --port 6006 --public-origin %(ENV_AutoDLService6006URL)s
directory=%(here)s/..
autostart=true
autorestart=true
startsecs=5
startretries=3
stopwaitsecs=25
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=%(here)s/../build/lab-deployment/backend.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=2
