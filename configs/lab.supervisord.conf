; Server-port Lab restored at the user's explicit request (2026-10-24).
; Serve the current research checkout; do not restart the stale GitHub release.
; The localhost:8000 research workbench remains available separately.
; Create build/lab-deployment and .secrets/lab-public-password (mode 600) first.
[unix_http_server]
file=%(here)s/../build/lab-deployment/supervisor.sock
chmod=0600

[supervisord]
logfile=%(here)s/../build/lab-deployment/supervisor.log
logfile_maxbytes=2MB
logfile_backups=2
pidfile=%(here)s/../build/lab-deployment/supervisord.pid
childlogdir=%(here)s/../build/lab-deployment
nodaemon=false

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix://%(here)s/../build/lab-deployment/supervisor.sock

[program:socialflux-lab-public]
command=python -u -m scripts.serve_pages_lab --host 0.0.0.0 --port 6006 --username socialflux --password-file .secrets/lab-public-password --proxy-secret-file .secrets/annotation-proxy-secret --public-origin %(ENV_AutoDLService6006URL)s --frontend-origin https://diudiu0515.github.io --annotation-public web/annotation_portable/dist/client --media-root data/sites_annotation/media
directory=%(here)s/..
autostart=true
autorestart=true
startsecs=5
startretries=3
stopwaitsecs=25
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=%(here)s/../build/lab-deployment/backend.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=2

[program:socialflux-annotation-storage]
command=node %(here)s/../web/annotation_portable/dist/server/server.mjs
directory=%(here)s/..
environment=ANNOTATION_DATABASE="%(here)s/../data/sites_annotation/annotation.sqlite3",ANNOTATION_PROXY_SECRET_FILE="%(here)s/../.secrets/annotation-proxy-secret",ANNOTATION_RECEIPTS="%(here)s/../data/sites_annotation/receipts",ANNOTATION_PORT="6067",ANNOTATION_IMPORT_SCRIPT="%(here)s/../scripts/import_portable_receipt.py",ANNOTATION_RESEARCH_ROOT="%(here)s/.."
autostart=true
autorestart=true
startsecs=3
startretries=3
stopwaitsecs=25
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=%(here)s/../build/lab-deployment/annotation-storage.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=2

; Private, read-only receipt index; never served by GitHub Pages.
[program:socialflux-annotation-archive]
command=python -u scripts/archive_annotation_by_reviewer.py --receipts data/sites_annotation/receipts --output data/sites_annotation/reviewer_archive --watch
directory=%(here)s/..
autostart=true
autorestart=true
startsecs=3
umask=0077
redirect_stderr=true
stdout_logfile=%(here)s/../build/lab-deployment/annotation-archive.log
stdout_logfile_maxbytes=2MB
stdout_logfile_backups=2
