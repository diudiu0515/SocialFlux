; Independent lifecycle for the local Qwen environment server.
[unix_http_server]
file=%(here)s/../build/qwen_deployment/supervisor.sock
chmod=0600

[supervisord]
logfile=%(here)s/../build/qwen_deployment/supervisor.log
logfile_maxbytes=2MB
logfile_backups=2
pidfile=%(here)s/../build/qwen_deployment/supervisord.pid
childlogdir=%(here)s/../build/qwen_deployment
nodaemon=false

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix://%(here)s/../build/qwen_deployment/supervisor.sock

[program:socialflux-qwen]
command=python -u scripts/serve_qwen_local.py
directory=%(here)s/..
autostart=true
autorestart=unexpected
startsecs=30
startretries=1
stopwaitsecs=60
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=%(here)s/../build/qwen_deployment/server.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=2
