; Independent Task4 lifecycle. QWEN_TASK4_RUN names an immutable prepared run.
[unix_http_server]
file=%(here)s/../../build/qwen_task4/supervisor.sock
chmod=0600

[supervisord]
logfile=%(here)s/../../build/qwen_task4/supervisor.log
logfile_maxbytes=2MB
logfile_backups=2
pidfile=%(here)s/../../build/qwen_task4/supervisord.pid
childlogdir=%(here)s/../../build/qwen_task4
nodaemon=false

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix://%(here)s/../../build/qwen_task4/supervisor.sock

[program:socialflux-qwen-task4]
command=%(here)s/../../build/qwen_deployment/venv/bin/python -u %(ENV_QWEN_TASK4_RUN)s/runtime/scripts/serve_qwen_task4.py --catalog %(ENV_QWEN_TASK4_RUN)s/catalog.json --output %(ENV_QWEN_TASK4_RUN)s/episodes --port 8011
directory=%(here)s/../..
autostart=true
autorestart=unexpected
startsecs=3
startretries=1
stopwaitsecs=4800
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=%(here)s/../../build/qwen_task4/service.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=2
