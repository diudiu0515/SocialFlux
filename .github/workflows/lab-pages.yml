name: Publish Lab on GitHub Pages
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - pages/**
      - .github/workflows/lab-pages.yml

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: lab-pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Check public artifact boundary
        run: |
          python - <<'PY'
          from pathlib import Path
          root=Path('pages')
          assert (root/'lab/index.html').is_file()
          assert (root/'annotation/index.html').is_file()
          for path in root.rglob('*'):
              if path.is_file():
                  assert path.name in {'.nojekyll','OFL-NotoSansSC.txt'} or path.suffix in {'.html','.css','.js','.woff2','.svg'}, path
                  if path.suffix in {'.html','.css','.js'}:
                      text=path.read_text()
                      assert 'chatgpt.site' not in text, path
                      assert 'gzip_base64' not in text, path
          PY
      - name: Check AutoDL public connectivity
        continue-on-error: true
        run: |
          python - <<'PYNET'
          import socket, urllib.request, urllib.error
          host='u294990-9e81-c55878e7.westc.seetacloud.com'
          try:
              print('Public DNS:', sorted({row[4][0] for row in socket.getaddrinfo(host,443)}))
          except Exception as e:
              print('::warning::AutoDL DNS: '+str(e))
          for port in ('', ':8443'):
              url='https://'+host+port+'/api/annotation/status'
              try:
                  with urllib.request.urlopen(url,timeout=15) as response: print(url,response.status)
              except urllib.error.HTTPError as e:
                  print(url, 'HTTP', e.code, '(401 is expected without credentials)')
              except Exception as e:
                  print('::warning::AutoDL public connection: '+url+' '+str(e))
          req=urllib.request.Request('https://'+host+':8443/api/lab',method='OPTIONS',headers={
              'Origin':'https://diudiu0515.github.io',
              'Access-Control-Request-Method':'GET',
              'Access-Control-Request-Headers':'authorization'})
          with urllib.request.urlopen(req,timeout=15) as response:
              print('Pages CORS:', response.status, response.headers.get('Access-Control-Allow-Origin'))
              assert response.status == 204
              assert response.headers.get('Access-Control-Allow-Origin') == 'https://diudiu0515.github.io'
          PYNET
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: pages
      - uses: actions/deploy-pages@v4
        id: deploy
