name: Publish independent Lab frontend
on:
  workflow_dispatch:
  push:
    branches: [lab-independent-hosting-20261022]
    paths:
      - web/static/experiment_hub.*
      - web/static/fonts/**
      - web/pages/**
      - scripts/build_lab_pages.py
      - .github/workflows/lab-pages.yml

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: lab-pages
  cancel-in-progress: true

jobs:
  publish:
    if: vars.LAB_BACKEND_URL != ''
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build frontend without research data
        env:
          LAB_BACKEND_URL: ${{ vars.LAB_BACKEND_URL }}
        run: python scripts/build_lab_pages.py --output build/lab-pages --backend-url "$LAB_BACKEND_URL"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/lab-pages
      - uses: actions/deploy-pages@v4
        id: deploy
